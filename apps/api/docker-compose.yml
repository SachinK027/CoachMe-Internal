services:
  postgres:
    image: postgres:16-alpine
    container_name: coachme-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: coachme
    ports:
      - "5432:5432"
    volumes:
      - coachme_pg:/var/lib/postgresql/data

volumes:
  coachme_pg:
